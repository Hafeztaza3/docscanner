name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack newest project zip
        shell: bash
        run: |
          best=""
          bestt=0
          for f in project*.zip; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$bestt" ]; then best="$f"; bestt="${t:-0}"; fi
          done
          echo "Using: $best"
          unzip -q -o "$best"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: SafhaScanner-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SafhaScanner.apk
          gh release create "apk-${{ github.run_number }}" SafhaScanner.apk --title "SafhaScanner #${{ github.run_number }}" --notes "Debug APK"
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f build.log ] || echo "no build log" > build.log
          grep -n -E "^e: |error:|FAILED|What went wrong|Could not|Caused by|AAPT|Execution failed" build.log | head -80 > errors.log || true
          tail -n 150 build.log > tail.log
          gh release create "buildlog-${{ github.run_number }}" errors.log tail.log --title "Build log #${{ github.run_number }}" --notes "Build failed"
          
